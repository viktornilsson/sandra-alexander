name: Byggkontroll

# Cloudflare Pages bygger och publicerar sidan själv vid varje push till main.
# Det här jobbet publicerar ingenting - det säger bara till om bygget går sönder,
# så att felet syns i pull requesten i stället för först i Cloudflare.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bygg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Kontrollera att bygget blev något
        run: |
          test -f dist/index.html
          test -f dist/img/og.jpg
          test -n "$(ls -A dist/img)"
